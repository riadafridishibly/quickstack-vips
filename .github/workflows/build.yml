name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - run: make dist
      - run: make test TARGET=linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS

  test-arm64:
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: mkdir dist/linux-arm64 && tar -xzf dist/quickstack-vips-$(cat VERSION)-linux-arm64.tar.gz -C dist/linux-arm64
      - run: make test TARGET=linux-arm64

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, test-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes "libvips $(cut -d- -f1 VERSION) and its libraries for linux-amd64, linux-arm64 and freebsd-amd64. See sources.txt for every version."
